# D-09: el plan gratuito de Render suspende la API tras 15 min sin tráfico.
# Este flujo la consulta cada 10 min en horario de uso (6:00–23:00, hora de Colombia)
# para que no quede dormida. GitHub solo ejecuta los "schedule" desde la rama main.
name: Mantener API despierta

on:
  schedule:
    - cron: "*/10 11-23,0-4 * * *"   # UTC; equivale a 6:00–23:59 en UTC-5
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API
        env:
          API_URL: ${{ vars.API_URL || 'https://shiftschash-api.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 120 --retry 2 "$API_URL/"
